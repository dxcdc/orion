<style>
/* Estilo do Menu Lateral Retrátil no Hover (75px -> 280px) idêntico à imagem CDC */
.sidebar-container {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 75px;
    min-width: 75px;
    z-index: 1050;
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-x: hidden;
    white-space: nowrap;
    background-color: #111827 !important;
}

/* Expansão Suave ao Aproximar o Mouse */
.sidebar-container:hover,
.sidebar-container.pinned {
    width: 280px;
    min-width: 280px;
}

/* Ocultar/Exibir Textos na Expansão */
.sidebar-container .sidebar-text-content {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
    white-space: nowrap;
}

.sidebar-container:hover .sidebar-text-content,
.sidebar-container.pinned .sidebar-text-content {
    opacity: 1;
    visibility: visible;
}

/* Ícones com tamanho ampliado 28px idênticos ao layout da imagem */
.sidebar-container i.min-w-icon {
    font-size: 28px !important;
    min-width: 42px;
    height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1 !important;
}

.icon-blue { color: #3b82f6 !important; }
.icon-orange { color: #f97316 !important; }
.icon-cyan { color: #06b6d4 !important; }
.icon-emerald { color: #10b981 !important; }
.icon-yellow { color: #f59e0b !important; }

.sidebar-card-item {
    background: rgba(30, 41, 59, 0.45);
    border-radius: 0.85rem !important;
    border: 1px solid rgba(255, 255, 255, 0.06);
    padding: 0.6rem 0.75rem !important;
    transition: all 0.25s ease;
}

.sidebar-card-item:hover {
    background: #1e293b !important;
    transform: translateX(2px);
}

/* Card Ativo com Borda de Destaque Laranja/Esmeralda na Esquerda */
.sidebar-card-item.active-card {
    background: #1e293b !important;
    border-left: 4px solid #f97316 !important;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

.active-subitem {
    color: #10b981 !important;
    font-weight: 600;
}

.hover-subitem:hover {
    color: #ffffff !important;
}

.sidebar-top-logo {
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
    transition: transform 0.3s ease;
}

.sidebar-container:hover .sidebar-top-logo {
    transform: scale(1.08);
}
</style>

<script>

</script>
